<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!--
      ⚠️ Favicon hiện là ảnh giữ chỗ của template. Thay bằng bộ nhận diện Every Half sau khi có
      thiết kế giao diện — cùng lúc với `src/assets/logo.tsx`.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Every Half · Quản lý tài sản</title>
    <meta name="title" content="Every Half · Quản lý tài sản" />
    <meta
      name="description"
      content="Hệ thống quản lý tài sản và công cụ dụng cụ nội bộ của Every Half."
    />
    <!--
      ⚠️ Công cụ nội bộ: không cho máy tìm kiếm lập chỉ mục trang đăng nhập. Đây không phải lớp
      bảo mật (robots không chặn được ai) — nó chỉ tránh việc tên miền nội bộ hiện trên kết quả
      tìm kiếm công khai.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Kiểu chữ EH-AM: Inter (thân/UI/số liệu), Bricolage Grotesque (hiển thị/tiêu đề,
      nét thương hiệu Every Half), SUSE Mono (mã tài sản/QR/serial/toạ độ). Manrope giữ
      để tương thích cấu hình cũ. Nạp qua Google Fonts như trước; service worker của PWA
      sẽ cache lại để chạy offline. Cân nhắc tự host woff2 khi cần siết CSP (xem
      product-design/20-design-system.md §PWA).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=SUSE+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA: cho phép cài đặt như ứng dụng; theme-color = giấy kem thương hiệu -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EH-AM" />
    <meta
      name="theme-color"
      content="#f9f9f6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#211e1b"
      media="(prefers-color-scheme: dark)"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
